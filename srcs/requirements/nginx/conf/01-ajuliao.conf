server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${WP_DOMAIN};

    access_log /var/log/nginx/${WP_DOMAIN}.log main;

    ssl_certificate /etc/nginx/ssl/${WP_DOMAIN}.crt;
    ssl_certificate_key /etc/nginx/ssl/${WP_DOMAIN}.key;
    
    ssl_protocols TLSv1.3;

    index index.php;
    root /var/www/html;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
         fastcgi_param HTTP_HOST $host;
    }

    location /adminer {
        proxy_pass http://adminer:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /static/ {
        proxy_pass http://resume:3000/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /resume {
        proxy_pass http://resume:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
